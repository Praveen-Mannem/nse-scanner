name: NSE Inside Bar Scanner

on:
  schedule:
    - cron: "30 3-8 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to scan"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - hourly

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials
        run: echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Run hourly scan (scheduled)
        if: github.event_name == 'schedule'
        run: python nse_scanner.py --timeframe hourly

      - name: Run daily scan (scheduled)
        if: github.event.schedule == '30 9 * * 1-5'
        run: python nse_scanner.py --timeframe daily

      - name: Run manual scan
        if: github.event_name == 'workflow_dispatch'
        run: python nse_scanner.py --timeframe ${{ github.event.inputs.timeframe }} --force
