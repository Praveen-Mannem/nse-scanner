name: NSE Inside Bar Scanner

# ─── Schedule overview (all times UTC → IST = UTC+5:30) ───────────────────
#
#  Hourly scan  runs every hour from 03:30 UTC to 10:00 UTC on weekdays,
#               which maps to 09:00–15:30 IST (NSE market hours).
#               Cron fires at HH:30 UTC so the scan starts just after the
#               candle closes at the top of the hour.
#
#  Daily scan   runs once at 10:30 UTC (16:00 IST), after NSE close,
#               so the final day candle is complete and confirmed.
#
#  Weekly scan  runs once on Friday at 11:00 UTC (16:30 IST), 30 min after
#               NSE close, so the weekly candle is fully settled.
#
#  Manual run   available via workflow_dispatch; choose daily, hourly, or weekly.
#
#  Symbol list  All scans read symbols/nse_equity_list.txt, which is kept
#               fresh by the separate "Update NSE Symbol List" workflow
#               (update-nse-symbols.yml). This job never does a live NSE
#               fetch itself — GitHub-hosted runner IPs get blocked by NSE
#               far more often than a home connection, and this job runs
#               too frequently (12+ times/day) to depend on that succeeding
#               every time. See update-nse-symbols.yml for details.
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Hourly scan: 03:30–09:30 UTC every weekday  (= 09:00–15:00 IST)
    - cron: "30 3-9 * * 1-5"
    # Daily scan:  10:30 UTC every weekday         (= 16:00 IST, post-market)
    - cron: "30 10 * * 1-5"
    # Weekly scan: 11:00 UTC every Friday          (= 16:30 IST, post-market)
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to scan"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - hourly
          - weekly
      debug_symbol:
        description: "Optional: NSE symbol (e.g. ELGIEQUIP) to diagnose instead of running the full scan. Leave blank for a normal manual run."
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials
        run: echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Verify symbol list exists
        run: |
          if [ ! -s symbols/nse_equity_list.txt ]; then
            echo "::error::symbols/nse_equity_list.txt is missing or empty. Run the 'Update NSE Symbol List' workflow first (workflow_dispatch), then re-run this scan."
            exit 1
          fi
          echo "Using $(wc -l < symbols/nse_equity_list.txt) symbols from symbols/nse_equity_list.txt"

      # ── Hourly scan ──
      # Runs only for the 03:30–09:30 UTC cron triggers (not the 10:30 daily one).
      - name: Run hourly scan (scheduled)
        if: github.event_name == 'schedule' && github.event.schedule == '30 3-9 * * 1-5'
        run: python nse_scanner.py --timeframe hourly --symbols-file symbols/nse_equity_list.txt

      # ── Daily scan ──
      # Runs only for the 10:30 UTC cron trigger.
      - name: Run daily scan (scheduled)
        if: github.event_name == 'schedule' && github.event.schedule == '30 10 * * 1-5'
        run: python nse_scanner.py --timeframe daily --symbols-file symbols/nse_equity_list.txt

      # ── Weekly scan ──
      # Runs only for the Friday 11:00 UTC cron trigger (--force bypasses the
      # Friday guard in the Python script since GHA already schedules correctly).
      - name: Run weekly scan (scheduled)
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 * * 5'
        run: python nse_scanner.py --timeframe weekly --force --symbols-file symbols/nse_equity_list.txt

      # ── Manual run ──
      - name: Run manual scan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_symbol == ''
        run: python nse_scanner.py --timeframe ${{ github.event.inputs.timeframe }} --force --symbols-file symbols/nse_equity_list.txt

      # ── Debug a single symbol ──
      # Prints the last 3 candles, liquidity numbers, and every pattern
      # condition (true/false) for one symbol instead of running the full
      # scan. Use this to see exactly why a stock you can see breaking out
      # on a chart isn't showing up in the sheet.
      - name: Debug single symbol
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_symbol != ''
        run: python nse_scanner.py --timeframe ${{ github.event.inputs.timeframe }} --debug-symbol "${{ github.event.inputs.debug_symbol }}"
